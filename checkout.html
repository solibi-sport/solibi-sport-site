<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוליבי ספורט - קופה ותשלום מאובטח</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- שואב את קובץ העיצוב הגלובלי (לפוטר, להדר ולקישורים המיוחדים) -->
    <link rel="stylesheet" href="solibi-app.css">
    
    <style>
        /* === צבעים מקומיים - הוספת נגיעות הכסוף === */
        :root {
            --brand-silver: #D1D5DB;
            --brand-silver-dark: #9CA3AF;
            --border-silver: rgba(209, 213, 219, 0.2);
        }

        /* =========================================
           דריסות מבנה - תואם ב-100% לשאר הדפים
           ========================================= */
        body {
            background: radial-gradient(circle at 50% 0%, rgba(214, 185, 83, 0.12) 0%, rgba(224, 224, 224, 0.05) 30%, #0a0a0a 70%) !important;
            color: #f5f5f5 !important;
            width: 100vw !important;
            height: 100vh !important; 
            overflow: hidden !important; 
            display: flex !important;
            flex-direction: column !important;
            margin: 0 !important;
        }

        /* אזור התוכן המרכזי */
        .checkout-main-container {
            flex: 1 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: clamp(15px, 3vh, 40px) 15px !important;
            overflow: hidden !important; 
        }

        /* חלון התשלום (קוביית הזכוכית) - עם מסגרת כסופה */
        .checkout-glass-box {
            display: flex;
            flex-direction: row;
            width: 100% !important; 
            max-width: 1100px !important; 
            height: 100% !important; 
            max-height: 750px !important;
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.85) 0%, rgba(5, 5, 5, 0.95) 100%) !important;
            backdrop-filter: blur(15px) !important;
            border: 1px solid var(--border-silver) !important; /* מסגרת כסופה */
            border-radius: 20px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8) !important;
            overflow: hidden !important; 
            animation: fadeUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           אזור הטפסים (צד ימין)
           ========================================= */
        .checkout-form-wrapper {
            flex: 1.8; 
            direction: ltr; /* מעביר פס גלילה לשמאל */
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(214, 185, 83, 0.4) transparent;
        }
        
        .checkout-form-wrapper::-webkit-scrollbar { width: 6px; }
        .checkout-form-wrapper::-webkit-scrollbar-thumb { background: rgba(214, 185, 83, 0.4); border-radius: 10px; }

        .checkout-form-side { 
            direction: rtl; /* מחזיר תוכן לימין לשמאל */
            padding: 25px; 
            display: flex; flex-direction: column; gap: 15px;
        }
        
        /* סקשן טופס עם מסגרת כסופה */
        .form-section { 
            background: #141414; 
            padding: 18px 25px; 
            border-radius: 12px; 
            border: 1px solid var(--border-silver); /* מסגרת כסופה */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            transition: 0.3s; 
        }
        .form-section:hover { 
            border-color: #D6B953; /* הופך לזהב במעבר */
            box-shadow: 0 6px 15px rgba(214, 185, 83, 0.15); 
        }

        .form-section-title { 
            font-size: 16px; font-weight: 900; color: #D6B953; 
            border-bottom: 2px solid var(--border-silver); /* קו הפרדה כסוף */
            padding-bottom: 8px; margin-bottom: 15px; 
            display: flex; align-items: center; gap: 8px;
        }
        
        .form-icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; opacity: 0.9; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; font-weight: 700; color: #f5f5f5; }
        
        .input-group input { 
            font-family: inherit; padding: 10px; border: 1px solid var(--border-silver); /* שדות מוקפים בכסוף */
            border-radius: 8px; font-size: 13px; outline: none; transition: 0.3s; background: #000; color: #f5f5f5;
        }
        .input-group input:focus { border-color: #D6B953; box-shadow: 0 0 0 2px rgba(214, 185, 83, 0.2); }
        .input-group input::placeholder { color: #555; }

        /* אפשרויות משלוח */
        .shipping-options { display: flex; gap: 10px; }
        .shipping-option { 
            flex: 1; display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 15px; border: 1px solid var(--border-silver); /* מסגרת כסופה */
            border-radius: 8px; cursor: pointer; transition: 0.2s; background: #000; 
        }
        .shipping-option:hover { border-color: #D6B953; background: #141414;}
        .shipping-option input[type="radio"] { accent-color: #D6B953; width: 16px; height: 16px; cursor: pointer; }
        .shipping-info { display: flex; align-items: center; gap: 10px; }
        .shipping-text strong { display: block; color: #f5f5f5; font-size: 13px; }
        .shipping-text span { font-size: 11px; color: #a0a0a0; }
        .shipping-price { font-weight: 900; color: #D6B953; font-size: 14px;}
        
        /* טופס אשראי - נגיעות כסוף */
        .credit-card-box { 
            background: linear-gradient(135deg, #111, #000); 
            padding: 20px 20px 25px 20px;
            border-radius: 12px; 
            border: 1px solid var(--brand-silver-dark); /* מסגרת כסופה בולטת יותר */
            color: #fff; 
            position: relative; 
            overflow: hidden; 
        }
        
        .cc-input { background: rgba(255,255,255,0.05) !important; border: 1px solid var(--border-silver) !important; color: #fff !important; }
        .cc-input:focus { border-color: #D6B953 !important; background: rgba(255,255,255,0.1) !important; box-shadow: 0 0 8px rgba(214, 185, 83, 0.3) !important;}
        .cc-input::placeholder { color: rgba(255,255,255,0.3) !important; }
        .cc-logos { display: flex; gap: 8px; margin-bottom: 12px; } 
        .cc-badge { background:rgba(214,185,83,0.1); color:#D6B953; font-weight:900; font-size:9px; padding:3px 6px; border-radius:4px; border: 1px solid #D6B953; letter-spacing: 1px;}

        /* =========================================
           סיכום הזמנה (צד שמאל)
           ========================================= */
        .checkout-summary-side { 
            flex: 1; 
            background: linear-gradient(135deg, #0f0f0f 0%, #000 100%); 
            border-right: 1px solid var(--border-silver); /* קו הפרדה כסוף */
            padding: 25px; color: #fff; display: flex; flex-direction: column; 
        }

        .summary-title { 
            font-size: 18px; font-weight: 900; margin-bottom: 15px; 
            border-bottom: 1px solid var(--border-silver); /* קו הפרדה כסוף */
            padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; color: #D6B953;
        }
        
        .scroll-container-ltr { flex: 1; direction: ltr; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
        .scroll-container-ltr::-webkit-scrollbar { width: 4px; }
        .scroll-container-ltr::-webkit-scrollbar-thumb { background: rgba(214,185,83,0.4); border-radius: 10px; }
        
        .order-items-mini { direction: rtl; display: flex; flex-direction: column; gap: 10px; }
        .mini-item { display: flex; align-items: center; gap: 10px; background: #141414; padding: 10px; border-radius: 8px; border: 1px solid var(--border-silver); /* מסגרת כסופה למוצר בקופה */ }
        
        .mini-img { width: 40px; height: 40px; background: #000; border: 1px solid var(--border-silver); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden;}
        .mini-img img { width: 100%; height: 100%; object-fit: cover;}
        
        .mini-info { flex: 1; display: flex; flex-direction: column; }
        .mini-name { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.2;}
        .mini-qty { font-size: 10px; color: #a0a0a0; margin-top: 2px;}
        .mini-price { font-weight: 900; color: #D6B953; font-size: 14px;}

        /* אזור סכומים וסיום תשלום */
        .totals-section { border-top: 1px solid var(--border-silver); padding-top: 12px; margin-top: auto;}
        .calc-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: #a0a0a0; }
        .total-row { margin-top: 8px; border-top: 1px dashed var(--border-silver); padding-top: 12px; font-size: 20px; font-weight: 900; color: #fff; display: flex; justify-content: space-between; align-items: center;}
        
        .pay-btn {
            background: #D6B953; color: #000; border: none; padding: 14px; border-radius: 10px;
            font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 15px; transition: 0.3s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .pay-btn:hover { transform: translateY(-2px); background: #FDF3C6; box-shadow: 0 6px 15px rgba(214, 185, 83, 0.3);}

        .secure-badge { text-align: center; margin-top: 10px; font-size: 10px; color: #a0a0a0; display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* מודאל הצלחה */
        .success-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9);
            z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.4s;
        }
        .success-overlay.active { opacity: 1; pointer-events: all; }
        .success-modal { background: #141414; border: 1px solid var(--brand-silver-dark); padding: 30px; border-radius: 15px; text-align: center; max-width: 350px; transform: scale(0.8); transition: 0.4s; }
        .success-overlay.active .success-modal { transform: scale(1); }
        .success-icon { width: 60px; height: 60px; background: #D6B953; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; }
        .success-title { font-size: 20px; font-weight: 900; color: #D6B953; margin-bottom: 8px; }
        .success-desc { font-size: 13px; color: #f5f5f5; margin-bottom: 15px; }
        .loader-bar { width: 100%; height: 4px; background: #333; border-radius: 2px; position: relative; }
        .loader-progress { position: absolute; top: 0; right: 0; height: 100%; background: #D6B953; width: 0%; transition: width 3s linear; }

        /* רספונסיביות */
        @media (max-width: 1024px) {
            .checkout-glass-box { max-width: 95% !important; height: 95% !important; max-height: none;}
            .checkout-form-side { padding: 15px; gap: 10px;}
            .form-section { padding: 15px; }
            .checkout-summary-side { padding: 20px; }
        }

        @media (max-width: 800px) {
            .checkout-glass-box { flex-direction: column-reverse; overflow-y: auto; height: auto !important; max-height: 90vh !important; }
            .checkout-summary-side { flex: none; border-right: none; border-bottom: 1px solid var(--border-silver); }
        }
    </style>
</head>
<body>

    <!-- 1. הדר אחיד -->
    <div id="header-placeholder"></div>

    <!-- 2. אזור הבמה המרכזי -->
    <main class="checkout-main-container">
        
        <!-- חלון התשלום המרכזי -->
        <div class="checkout-glass-box">
            
            <!-- טפסים ומילוי פרטים (צד ימין) -->
            <div class="checkout-form-wrapper">
                <form class="checkout-form-side" autocomplete="off" onsubmit="event.preventDefault(); processPayment();">
                    
                    <div class="form-section">
                        <h2 class="form-section-title">
                            <svg class="form-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            פרטים אישיים
                        </h2>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>שם פרטי</label>
                                <input type="text" placeholder="למשל: ישראל" autocomplete="new-password">
                            </div>
                            <div class="input-group">
                                <label>שם משפחה</label>
                                <input type="text" placeholder="למשל: ישראלי" autocomplete="new-password">
                            </div>
                            <div class="input-group">
                                <label>דואר אלקטרוני</label>
                                <input type="email" placeholder="email@example.com" autocomplete="new-password">
                            </div>
                            <div class="input-group">
                                <label>מספר טלפון</label>
                                <input type="tel" placeholder="05X-XXXXXXX" dir="ltr" style="text-align: right;" autocomplete="new-password">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="form-section-title">
                            <svg class="form-icon" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                            כתובת ומשלוח
                        </h2>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>עיר / יישוב</label>
                                <input type="text" placeholder="הכנס עיר" autocomplete="new-password">
                            </div>
                            <div class="input-group">
                                <label>רחוב ומספר בית</label>
                                <input type="text" placeholder="הכנס כתובת מדויקת" autocomplete="new-password">
                            </div>
                            <div class="input-group">
                                <label>דירה / קומה (אופציונלי)</label>
                                <input type="text" placeholder="למשל: דירה 4" autocomplete="new-password">
                            </div>
                            <div class="input-group">
                                <label>מיקוד</label>
                                <input type="text" placeholder="מיקוד 7 ספרות" autocomplete="new-password">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="form-section-title">שיטת משלוח</h2>
                        <div class="shipping-options">
                            <label class="shipping-option">
                                <div class="shipping-info">
                                    <input type="radio" name="shipping" value="0" checked onchange="updateShipping(0)">
                                    <div class="shipping-text">
                                        <strong>נקודת איסוף (Boxit)</strong>
                                        <span>הגעה תוך 3-5 ימי עסקים</span>
                                    </div>
                                </div>
                                <div class="shipping-price">חינם</div>
                            </label>
                            <label class="shipping-option">
                                <div class="shipping-info">
                                    <input type="radio" name="shipping" value="35" onchange="updateShipping(35)">
                                    <div class="shipping-text">
                                        <strong>שליח עד הבית (Express)</strong>
                                        <span>הגעה תוך 1-3 ימי עסקים</span>
                                    </div>
                                </div>
                                <div class="shipping-price">₪35</div>
                            </label>
                        </div>
                    </div>

                    <div class="form-section" style="padding: 0; border: none; box-shadow: none; background: transparent;">
                        <div class="credit-card-box">
                            <div class="cc-logos">
                                <div class="cc-badge">VISA</div>
                                <div class="cc-badge">MasterCard</div>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 10px;">
                                <div class="input-group">
                                    <label style="color: #a0a0a0;">מספר כרטיס אשראי</label>
                                    <input type="text" class="cc-input" placeholder="XXXX XXXX XXXX XXXX" dir="ltr" style="text-align: left; font-size: 14px; letter-spacing: 2px;" autocomplete="off">
                                </div>
                                <div class="form-grid">
                                    <div class="input-group">
                                        <label style="color: #a0a0a0;">תוקף (MM/YY)</label>
                                        <input type="text" class="cc-input" placeholder="12/26" dir="ltr" style="text-align: center;" autocomplete="off">
                                    </div>
                                    <div class="input-group">
                                        <label style="color: #a0a0a0;">CVV</label>
                                        <input type="text" class="cc-input" placeholder="123" dir="ltr" style="text-align: center;" maxlength="3" autocomplete="off">
                                    </div>
                                </div>
                                <div class="form-grid">
                                    <div class="input-group">
                                        <label style="color: #a0a0a0;">שם בעל הכרטיס</label>
                                        <input type="text" class="cc-input" placeholder="כפי שמופיע על הכרטיס" autocomplete="off">
                                    </div>
                                    <div class="input-group">
                                        <label style="color: #a0a0a0;">ת.ז בעל הכרטיס</label>
                                        <input type="text" class="cc-input" placeholder="9 ספרות" dir="ltr" style="text-align: center;" maxlength="9" autocomplete="off">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </form>
            </div>

            <!-- אזור סיכום קופה (צד שמאל) -->
            <div class="checkout-summary-side">
                <h2 class="summary-title">
                    <span>סיכום הזמנה</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                </h2>
                
                <div class="scroll-container-ltr">
                    <div class="order-items-mini" id="checkout-items-list">
                        <!-- הפריטים יוזרקו לכאן -->
                    </div>
                </div>

                <div class="totals-section">
                    <div class="calc-row"><span>סכום ביניים:</span> <span id="calc-subtotal">0 ₪</span></div>
                    <div class="calc-row"><span>דמי משלוח:</span> <span id="calc-shipping">חינם</span></div>
                    
                    <div class="total-row"><span>סה"כ לתשלום:</span> <span id="calc-total" style="color: #D6B953;">0 ₪</span></div>
                    
                    <button class="pay-btn" onclick="processPayment()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        שלם עכשיו
                    </button>
                    
                    <div class="secure-badge">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        הרכישה מוצפנת ומאובטחת בתקן SSL מחמיר
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 3. פוטר וטיקר האחיד (מחליף את הישן הקשיח) -->
    <footer class="app-footer">
        <div class="footer-links">
            <a href="about.html">אודות</a>
            <a href="contact.html">צור קשר</a>
            <a href="terms.html">תקנון ומדיניות</a>
        </div>
        <div id="ticker-placeholder"></div>
    </footer>

    <!-- מודאל הצלחה -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-modal">
            <div class="success-icon">
                <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h2 class="success-title">התשלום בוצע בהצלחה!</h2>
            <p class="success-desc">תודה שקנית בסוליבי ספורט.<br>מספר ההזמנה וקבלה נשלחו אליך למייל.</p>
            <div class="loader-bar">
                <div class="loader-progress" id="loaderProgress"></div>
            </div>
            <p style="font-size: 11px; color: #a0a0a0; margin-top: 10px;">מעביר אותך חזרה לחנות...</p>
        </div>
    </div>

    <script>
        // טעינת ההדר והטיקר בצורה אחידה[cite: 10]
        fetch('header.html').then(res => res.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
        fetch('ticker.html').then(res => res.text()).then(data => document.getElementById('ticker-placeholder').innerHTML = data);

        let subtotal = 0;
        let shippingCost = 0;

        function loadOrderData() {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            
            if (cart.length === 0) {
                alert("העגלה שלך ריקה. מחזיר אותך לחנות.");
                window.location.href = 'index.html'; 
                return;
            }

            const list = document.getElementById('checkout-items-list');
            list.innerHTML = '';
            subtotal = 0;
            
            cart.forEach(item => {
                subtotal += (item.price * item.quantity);
                let imageHTML = item.img && item.img.includes('<svg') ? item.img : `<img src="${item.img || 'mystery-box.jpg.png'}" alt="${item.name}">`;

                list.innerHTML += `
                    <div class="mini-item">
                        <div class="mini-img">${imageHTML}</div>
                        <div class="mini-info">
                            <span class="mini-name">${item.name}</span>
                            <span class="mini-qty">כמות: ${item.quantity}</span>
                        </div>
                        <span class="mini-price">${item.price * item.quantity} ₪</span>
                    </div>
                `;
            });

            updateTotals();
        }

        function updateShipping(cost) {
            shippingCost = cost;
            updateTotals();
        }

        function updateTotals() {
            document.getElementById('calc-subtotal').innerText = subtotal + ' ₪';
            document.getElementById('calc-shipping').innerText = shippingCost === 0 ? 'חינם' : shippingCost + ' ₪';
            document.getElementById('calc-total').innerText = (subtotal + shippingCost) + ' ₪';
        }

        function processPayment() {
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('active');
            
            setTimeout(() => {
                document.getElementById('loaderProgress').style.width = '100%';
            }, 100);

            setTimeout(() => {
                localStorage.removeItem('solibiCart');
                window.location.href = 'index.html'; 
            }, 3000);
        }

        window.onload = loadOrderData;
    </script>
    <script src="search.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
