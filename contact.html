<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוליבי ספורט - צור קשר</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- שואב את קובץ העיצוב הגלובלי (לפוטר ולהדר) -->
    <link rel="stylesheet" href="solibi-app.css">
    
    <style>
        /* =========================================
           דריסות מבנה - זהה לחלוטין לדף האודות!
           ========================================= */
        body {
            background: radial-gradient(circle at 50% 0%, rgba(214, 185, 83, 0.12) 0%, rgba(224, 224, 224, 0.05) 30%, #0a0a0a 70%) !important;
            color: #f5f5f5 !important;
            width: 100vw !important;
            height: 100vh !important; 
            overflow: hidden !important; /* נועל את העמוד הראשי לגמרי */
            display: flex !important;
            flex-direction: column !important;
            margin: 0 !important;
        }

        /* אזור התוכן שבין ההדר לפוטר - תופס את שאר המקום */
        .contact-main-container {
            flex: 1 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: clamp(15px, 3vh, 40px) 15px !important;
            overflow: hidden !important; 
        }

        /* קוביית הזכוכית המרכזית (בתוכה תהיה הגלילה) */
        .contact-glass-box {
            width: 100% !important;
            max-width: 950px !important;
            height: 100% !important;
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.8) 0%, rgba(5, 5, 5, 0.95) 100%) !important;
            backdrop-filter: blur(15px) !important;
            border: 1px solid rgba(224, 224, 224, 0.1) !important;
            border-radius: 20px !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8) !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important; 
        }

        /* אזור הגלילה עצמו - הגלילה קורית רק כאן! */
        .contact-scroll-area {
            flex: 1 !important;
            overflow-y: auto !important; 
            padding: 40px !important;
            scrollbar-width: thin !important;
            scrollbar-color: rgba(214, 185, 83, 0.4) transparent !important;
            /* טריק להעברת פס הגלילה ימינה */
            direction: ltr !important; 
        }

        /* עיצוב הפס גלילה הפנימי */
        .contact-scroll-area::-webkit-scrollbar { width: 6px; }
        .contact-scroll-area::-webkit-scrollbar-thumb { background: rgba(214, 185, 83, 0.4); border-radius: 10px; }

        /* התוכן הפנימי - מוחזר לימין לשמאל */
        .contact-inner-content {
            direction: rtl !important;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           עיצוב קוביות התוכן של צור קשר
           ========================================= */
        .contact-subtitle {
            font-size: 18px;
            color: #a0a0a0;
            font-weight: 500;
            margin-bottom: 45px;
            text-align: center;
            line-height: 1.5;
            max-width: 700px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
            margin-bottom: 50px;
        }

        .contact-card {
            background: #141414;
            border-radius: 16px;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #f5f5f5;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(214, 185, 83, 0.3);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
        }

        .contact-card:hover {
            transform: translateY(-8px);
            border-color: #D6B953;
            box-shadow: 0 15px 30px rgba(214, 185, 83, 0.15);
        }

        .contact-icon {
            width: 50px; height: 50px;
            color: #D6B953;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        
        .contact-card:hover .contact-icon { transform: scale(1.15); color: #FDF3C6; }
        .contact-method { font-size: 20px; font-weight: 900; margin-bottom: 5px; }
        .contact-detail { font-size: 15px; font-weight: 500; color: #a0a0a0; direction: ltr; }

        .divider {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(214, 185, 83, 0.3), transparent);
            margin: 0 0 40px 0;
            flex-shrink: 0;
        }

        .social-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-wrap: wrap;
            gap: 20px;
        }

        .social-links { display: flex; gap: 15px; }
        .social-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #000;
            border: 1px solid rgba(214, 185, 83, 0.3);
            display: flex; align-items: center; justify-content: center;
            color: #D6B953;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .social-btn:hover { background: #D6B953; color: #000; transform: translateY(-3px); border-color: #D6B953; }
        .social-btn svg { width: 22px; height: 22px; }

        .business-link-card {
            background: rgba(214, 185, 83, 0.1);
            border: 1px solid #D6B953;
            padding: 15px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #f5f5f5;
            transition: 0.3s;
            min-width: 220px;
        }
        
        .business-link-card:hover { background: #D6B953; color: #000; transform: scale(1.02); }

        @media (max-width: 900px) {
            .contact-grid { grid-template-columns: repeat(2, 1fr); }
            .social-section { flex-direction: column; justify-content: center; }
            .contact-scroll-area { padding: 20px !important; }
        }
        @media (max-width: 600px) {
            .contact-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 1. הדר - נעול למעלה -->
    <div id="header-placeholder"></div>

    <!-- 2. אזור הבמה המרכזי -->
    <main class="contact-main-container">
        
        <!-- קוביית הזכוכית המרכזית -->
        <div class="contact-glass-box">
            
            <!-- 3. אזור הגלילה הפנימי -->
            <div class="contact-scroll-area">
                <div class="contact-inner-content">
                    
                    <div class="contact-subtitle">

                    </div>

                    <div class="contact-grid">
                        <a href="tel:0527287898" class="contact-card">
                            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>

                        <a href="https://wa.me/972527287898" target="_blank" class="contact-card">
                            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>

                        <a href="mailto:info@solibi-seder.co.il" class="contact-card">
                            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            </svg>
                            <div class="contact-method">דואר אלקטרוני</div>
                            <div class="contact-detail">info@solibi-seder.co.il</div>

                    </div>

                    <div class="divider"></div>

                    <div class="social-section">
                        <div class="social-links">

                            </a>
                            <a href="https://www.facebook.com/profile.php?id=61590342757556" target="_blank" class="social-btn" title="פייסבוק">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>

                            <a href="https://www.instagram.com/solibi_sport/" target="_blank" class="social-btn" title="אינסטגרם">

                            </a>
                            <a href="https://www.tiktok.com/@solibi_sport" target="_blank" class="social-btn" title="טיקטוק">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>
                            </a>
                        </div>

                        <a href="https://business.solibi-seder.co.il/" target="_blank" class="business-link-card">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                            </svg>
                            <div style="flex: 1; text-align: center;">
                                <div style="font-size: 11px; opacity: 0.8; margin-bottom: 2px;">בעל עסק? גלה את</div>
                                <div style="font-size: 15px; font-weight: 900;">סוליבי עסקים</div>
                            </div>
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>
    </main>

    <!-- 4. פוטר וטיקר (זהה לחלוטין) -->
    <footer class="app-footer">
        <div class="footer-links">
            <a href="about.html">אודות</a>
            <a href="contact.html">צור קשר</a>
            <a href="terms.html">תקנון ומדיניות</a>
        </div>
        <div id="ticker-placeholder"></div>
    </footer>

    <!-- סקריפטים -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('header-placeholder');
                if(placeholder) placeholder.innerHTML = data;
            });

        fetch('ticker.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('ticker-placeholder');
                if(placeholder) placeholder.innerHTML = data;
            });
    </script>
    <script src="search.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
