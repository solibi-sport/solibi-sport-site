<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוליבי ספורט - צור קשר VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- שואב את קובץ העיצוב הגלובלי (לפוטר ולהדר) -->
    <link rel="stylesheet" href="solibi-app.css">
    
    <style>
        /* =========================================
           נעילת מסך מלאה (100vh) ומרכוז סימטרי מושלם (SPA)
           ========================================= */
        html, body.contact-page-body {
            height: 100vh !important;
            max-height: 100vh !important;
            width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            background-color: #0b0c10 !important;
            color: #ffffff !important;
        }

        #header-placeholder,
        #ticker-placeholder {
            flex-shrink: 0;
            width: 100%;
            z-index: 100;
        }

        /* אזור הבמה המרכזי - ממורכז בדיוק באמצע בין ההדר לפוטר! */
        .contact-main-container {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important; /* ממרכז אנכית במקום להצמיד למעלה */
            padding: 20px 30px !important;
            box-sizing: border-box !important;
        }

        /* =========================================
           קוביית ה-VIP המרכזית של צור קשר
           ========================================= */
        .contact-glass-box {
            position: relative;
            width: 100% !important;
            max-width: 980px !important;
            height: auto !important;
            background: linear-gradient(160deg, rgba(20, 24, 34, 0.96) 0%, rgba(10, 12, 17, 0.98) 100%) !important;
            border: 1px solid rgba(212, 175, 55, 0.45) !important;
            border-right: 5px solid #D4AF37 !important;
            border-radius: 22px !important;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(212, 175, 55, 0.12) !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            animation: fadeUp 0.5s ease forwards;
        }

        /* פס תאורה מוזהב בראש הקובייה */
        .contact-glass-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff3b0, #D4AF37, #fff3b0, transparent);
            box-shadow: 0 2px 20px 2px rgba(212, 175, 55, 0.5);
            z-index: 5;
            pointer-events: none;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .contact-scroll-area {
            padding: 34px 42px !important;
            overflow: hidden !important;
            direction: rtl !important;
        }

        .contact-inner-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vip-contact-badge {
            background: rgba(212, 175, 55, 0.14);
            color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.45);
            font-size: 11.5px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 30px;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.8px;
        }

        .contact-main-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 8px 0;
            text-align: center;
            text-shadow: 0 6px 18px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.25);
        }

        .contact-main-title span {
            color: #D4AF37;
        }

        .contact-subtitle {
            font-size: 15px;
            color: #cbd5e1;
            font-weight: 400;
            margin-bottom: 28px;
            text-align: center;
            line-height: 1.55;
            max-width: 680px;
        }

        /* =========================================
           3 כרטיסיות יצירת הקשר
           ========================================= */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            width: 100%;
            margin-bottom: 28px;
        }

        .contact-card {
            background: radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.15) 0%, rgba(9, 11, 16, 0.95) 75%);
            border-radius: 16px;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
        }

        .contact-card:hover {
            transform: translateY(-5px);
            border-color: #D4AF37;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.95), 0 0 22px rgba(212, 175, 55, 0.25);
        }

        .contact-icon-box {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.24) 0%, #07080c 100%);
            border: 1px solid rgba(212, 175, 55, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }

        .contact-icon {
            width: 26px;
            height: 26px;
            color: #D4AF37;
            transition: 0.3s;
        }
        
        .contact-card:hover .contact-icon-box {
            background: linear-gradient(135deg, #fff3b0 0%, #D4AF37 100%);
            transform: scale(1.08);
        }

        .contact-card:hover .contact-icon {
            color: #0b0c10;
        }

        .contact-method {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .contact-detail {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            direction: ltr;
        }

        .contact-card:hover .contact-detail {
            color: #D4AF37;
        }

        /* =========================================
           קו הפרדה אופקי מוזהב עם יהלום
           ========================================= */
        .gold-diamond-divider {
            position: relative;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(212, 175, 55, 0.85) 50%, transparent 100%);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            margin: 0 0 26px 0;
            flex-shrink: 0;
        }

        .gold-diamond-divider::after {
            content: '❖';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #12151e;
            border: 1px solid rgba(212, 175, 55, 0.75);
            border-radius: 50px;
            color: #D4AF37;
            padding: 2px 15px;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.45);
        }

        /* =========================================
           שורה תחתונה: רשתות חברתיות + סוליבי עסקים
           ========================================= */
        .social-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-wrap: wrap;
            gap: 20px;
        }

        .social-links {
            display: flex;
            gap: 14px;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, #07080c 100%);
            border: 1px solid rgba(212, 175, 55, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
        }
        
        .social-btn:hover {
            background: linear-gradient(135deg, #fff3b0 0%, #D4AF37 100%);
            color: #0b0c10;
            transform: translateY(-3px);
            border-color: #fff3b0;
            box-shadow: 0 10px 22px rgba(212, 175, 55, 0.35);
        }

        .social-btn svg {
            width: 21px;
            height: 21px;
        }

        .business-link-card {
            background: radial-gradient(circle at 80% 50%, rgba(212, 175, 55, 0.22) 0%, rgba(11, 13, 19, 0.95) 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.65);
            padding: 11px 28px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            min-width: 225px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75), 0 0 16px rgba(212, 175, 55, 0.15);
        }

        .business-link-card svg {
            color: #D4AF37;
            transition: 0.3s;
        }
        
        .business-link-card:hover {
            background: linear-gradient(135deg, #e5c158 0%, #D4AF37 50%, #b59024 100%);
            color: #0b0c10;
            border-color: #fff3b0;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(212, 175, 55, 0.4);
        }

        .business-link-card:hover svg {
            color: #0b0c10;
        }

        /* =========================================
           זום פרופורציונלי מלא (זהה לשאר דפי האתר)
           ========================================= */
        @media (min-width: 1100px) {
            .contact-glass-box {
                zoom: 1.15; /* מגדיל את כל הקובייה והתוכן שבה ב-15% באותה פרופורציה בדיוק */
                max-width: 980px !important;
            }
        }

        @media (max-width: 900px) {
            html, body.contact-page-body {
                height: auto !important;
                max-height: none !important;
                overflow-y: auto !important;
            }
            .contact-grid {
                grid-template-columns: 1fr;
            }
            .social-section {
                flex-direction: column;
                justify-content: center;
            }
            .contact-scroll-area {
                padding: 24px !important;
            }
        }
    </style>
</head>

    <!-- 3. פוטר תחתון קבוע -->

    <!-- סקריפטים -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('header-placeholder');
                if(placeholder) placeholder.innerHTML = data;
            });

        fetch('ticker.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('ticker-placeholder');
                if(placeholder) placeholder.innerHTML = data;
            });
    </script>
