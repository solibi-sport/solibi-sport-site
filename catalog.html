<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קטלוג מוצרים | סוליבי ספורט VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="solibi-app.css">
    
    <style>
        /* =========================================
           נעילת מסך מלאה ללא גלילה כלל (100vh)
           ========================================= */
        html, body {
            height: 100vh !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            background-color: #0b0c10;
        }

        #header-placeholder {
            flex-shrink: 0;
            width: 100%;
            z-index: 100;
        }

        main.catalog-spa-viewport {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            width: 100% !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* =========================================
           פריסת Grid רחבה עם מרווח פתוח והפרדה ברורה
           ========================================= */
        .catalog-page-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            width: 96%;
            max-width: 1840px;
            margin: 0 auto;
            padding: 20px 10px 20px 30px; /* מצמיד את הסיידבר עוד ימינה */
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 330px 1fr;
            grid-template-rows: auto 1fr auto;
            column-gap: 96px; /* מרווח אוויר גדול שמפריד את הסיידבר מהקוביות */
            height: 100%;
        }

        /* שורה 1: כותרת הקטגוריה + קו יהלום עליון מרווח */
        .catalog-top-header {
            grid-column: 2;
            grid-row: 1;
            width: 100%;
            padding-bottom: 20px;
        }

        .catalog-category-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin: 0 0 18px 0; /* מרווח נקי שמונע מהכותרת לשבת על הקו והיהלום */
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: 0 8px 20px rgba(0, 0, 0, 0.85), 0 0 18px rgba(212, 175, 55, 0.25);
        }

        .gold-diamond-divider {
            position: relative;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(212, 175, 55, 0.85) 50%, transparent 100%);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            margin: 0;
        }

        .gold-diamond-divider::after {
            content: '❖';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* ממורכז בדיוק על הקו */
            background: #12151e;
            border: 1px solid rgba(212, 175, 55, 0.75);
            border-radius: 50px;
            color: #D4AF37;
            padding: 2px 15px;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.45);
        }

        /* =========================================
           שורה 2 (עמודה ימנית): הסיידבר + קו הפרדה אנכי מוזהב עם יהלום
           ========================================= */
        .catalog-sidebar {
            position: relative; /* עבור קו ההפרדה האנכי */
            grid-column: 1;
            grid-row: 2;
            /* רקע כהה ועמוק יותר שמבדל אותו מהקוביות */
            background: radial-gradient(circle at 100% 20%, rgba(212, 175, 55, 0.14) 0%, #0d0f16 55%, #07080c 100%);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-right: 5px solid #D4AF37;
            border-radius: 18px;
            padding: 28px 24px;
            box-shadow: -15px 20px 50px rgba(0, 0, 0, 0.95), 0 0 25px rgba(212, 175, 55, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%;
            box-sizing: border-box;
        }

        /* קו זהב אנכי עדין באמצע הרווח שבין הסיידבר לקוביות */
        .catalog-sidebar::before {
            content: '';
            position: absolute;
            top: 6%;
            bottom: 6%;
            left: -49px; /* יושב בדיוק באמצע ה-column-gap (96px) */
            width: 2px;
            background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.75) 50%, transparent 100%);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            pointer-events: none;
        }

        /* יהלום זהב במרכז הקו האנכי */
        .catalog-sidebar::after {
            content: '❖';
            position: absolute;
            top: 50%;
            left: -48px;
            transform: translate(-50%, -50%);
            background: #12151e;
            border: 1px solid rgba(212, 175, 55, 0.75);
            border-radius: 50px;
            color: #D4AF37;
            padding: 10px 4px;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.45);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
            pointer-events: none;
        }

        .sidebar-main-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            padding-bottom: 18px;
            margin: 0 0 22px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .sidebar-main-title i {
            color: #D4AF37;
        }

        .sidebar-cat-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sidebar-cat-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            padding: 15px 18px;
            color: #94a3b8;
            font-family: 'Rubik', sans-serif;
            font-size: 16.5px;
            font-weight: 700;
            text-align: right;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .sidebar-cat-btn span {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-cat-btn i.cat-icon {
            color: rgba(212, 175, 55, 0.65);
            font-size: 17px;
            width: 22px;
            text-align: center;
        }

        .sidebar-cat-btn:hover {
            color: #ffffff;
            border-color: rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.08);
            transform: translateX(-4px);
        }

        .sidebar-cat-btn.active {
            background: radial-gradient(circle at 85% 50%, rgba(212, 175, 55, 0.28) 0%, rgba(212, 175, 55, 0.1) 100%);
            border: 1px solid #D4AF37;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.65), 0 0 18px rgba(212, 175, 55, 0.22);
        }

        .sidebar-cat-btn.active i.cat-icon {
            color: #D4AF37;
        }

        .sidebar-brand-oval {
            margin-top: auto;
            align-self: center;
            width: 92%;
            padding: 12px 18px;
            border-radius: 50px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, rgba(11, 12, 16, 0.95) 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            color: #D4AF37;
            font-size: 15.5px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 1.5px;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.16);
        }

        /* =========================================
           שורה 2 (עמודה שמאלית): 6 קוביות רחבות על כל השטח
           ========================================= */
        .catalog-grid-6 {
            grid-column: 2;
            grid-row: 2;
            width: 100%; /* מנצל את כל רוחב התוכן בלי להשאיר שטחים מתים בצדדים */
            height: 100%;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 22px 28px;
        }

        .catalog-product-card {
            position: relative;
            background: radial-gradient(circle at 50% 35%, rgba(212, 175, 55, 0.16) 0%, #12141c 70%);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 16px;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 18px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .catalog-product-card:hover {
            transform: translateY(-4px);
            border-color: #D4AF37;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.95), 0 0 22px rgba(212, 175, 55, 0.25);
        }

        .catalog-card-badge {
            flex-shrink: 0;
            align-self: flex-start;
            background: rgba(212, 175, 55, 0.14);
            color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.42);
            font-size: 11.5px;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 30px;
        }

        .catalog-card-img {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 4px 0;
        }

        .catalog-card-img img {
            max-height: 92%;
            max-width: 78%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.88));
            transition: transform 0.3s ease;
        }

        .catalog-product-card:hover .catalog-card-img img {
            transform: scale(1.06);
        }

        .catalog-card-footer {
            flex-shrink: 0;
            width: 100%;
            background: rgba(11, 12, 16, 0.94);
            border: 1px solid rgba(212, 175, 55, 0.24);
            border-radius: 12px;
            padding: 9px 14px;
            box-sizing: border-box;
        }

        .catalog-product-title {
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            margin: 0 0 6px 0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .catalog-card-actions {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 6px;
            gap: 10px;
        }

        .catalog-add-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.08) 100%);
            color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            padding: 6px 10px;
            font-family: 'Rubik', sans-serif;
            font-size: 12.5px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .catalog-product-card:hover .catalog-add-btn,
        .catalog-add-btn:hover {
            background: linear-gradient(135deg, #D4AF37 0%, #b5952f 100%);
            color: #0b0c10;
            border-color: #D4AF37;
        }

        .catalog-price-box {
            color: #D4AF37;
            font-size: 14.5px;
            font-weight: 900;
            text-align: left;
            padding-right: 8px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        /* =========================================
           שורה 3: קו הפרדה תחתון + כפתורי הקודם / הבא
           ========================================= */
        .catalog-bottom-nav {
            grid-column: 2;
            grid-row: 3;
            width: 100%;
            padding-top: 22px;
        }

        .catalog-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-top: 18px; /* מרווח נקי מתחת ליהלום התחתון */
        }

        .pagination-btn {
            min-width: 135px;
            background: linear-gradient(135deg, rgba(20, 24, 34, 0.95) 0%, rgba(11, 12, 16, 0.98) 100%);
            color: #ffffff;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
            padding: 8px 22px;
            font-family: 'Rubik', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .pagination-btn i {
            color: #D4AF37;
        }

        .pagination-btn:hover {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.15);
            transform: translateY(-2px);
        }

        #ticker-placeholder {
            flex-shrink: 0;
            width: 100%;
            z-index: 100;
        }
    </style>
    <link rel="stylesheet" href="mobile-webapp.css" media="(max-width: 768px)">
</head>
<body>

    <!-- 1. הדר עליון קבוע -->
    <div id="header-placeholder"></div>

    <!-- 2. אזור הקטלוג המרכזי -->
    <main class="catalog-spa-viewport">
        <div class="catalog-page-wrapper">
            
            <!-- שורה 1: כותרת הקטגוריה וקו היהלום העליון -->
            <div class="catalog-top-header">
                <h1 id="active-category-heading" class="catalog-category-title">מיסטרי</h1>
                <div class="gold-diamond-divider"></div>
            </div>

            <!-- שורה 2 (ימין): סיידבר מורחב ומיושר בדיוק לקוביות -->
            <aside class="catalog-sidebar">
                <h2 class="sidebar-main-title"><i class="fa-solid fa-layer-group"></i> קטלוג מוצרים</h2>
                
                <ul class="sidebar-cat-list">
                    <li>
                        <button class="sidebar-cat-btn active" onclick="selectCatalogCategory('mystery', 'מיסטרי', this)">
                            <span><i class="fa-solid fa-box-open cat-icon"></i> מיסטרי</span>
                            <i class="fa-solid fa-chevron-left" style="font-size: 12px;"></i>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-cat-btn" onclick="selectCatalogCategory('packages', 'מארזים', this)">
                            <span><i class="fa-solid fa-gift cat-icon"></i> מארזים</span>
                            <i class="fa-solid fa-chevron-left" style="font-size: 12px;"></i>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-cat-btn" onclick="selectCatalogCategory('accessories', 'מוצרים נלווים', this)">
                            <span><i class="fa-solid fa-futbol cat-icon"></i> מוצרים נלווים</span>
                            <i class="fa-solid fa-chevron-left" style="font-size: 12px;"></i>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-cat-btn" onclick="selectCatalogCategory('cards', 'קלפים ומדבקות', this)">
                            <span><i class="fa-solid fa-star cat-icon"></i> קלפים ומדבקות</span>
                            <i class="fa-solid fa-chevron-left" style="font-size: 12px;"></i>
                        </button>
                    </li>
                </ul>

                <div class="sidebar-brand-oval">סוליבי ספורט</div>
            </aside>

            <!-- שורה 2 (שמאל/מרכז): 6 קוביות מוצר רחבות על כל השטח -->
            <div id="catalog-products-grid" class="catalog-grid-6"></div>

            <!-- שורה 3: קו הפרדה תחתון וכפתורי הקודם / הבא -->
            <div class="catalog-bottom-nav">
                <div class="gold-diamond-divider"></div>
                <div class="catalog-pagination">
                    <button class="pagination-btn" onclick="changeCatalogPage(-1)">
                        <i class="fa-solid fa-arrow-right"></i> הקודם
                    </button>
                    <button class="pagination-btn" onclick="changeCatalogPage(1)">
                        הבא <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- 3. פוטר תחתון קבוע -->
        <div id="ticker-placeholder"></div>
    </main>

    <script>
        const catalogData = {
            mystery: [
                { title: 'מיסטרי בוקס VIP מוזהב', price: '199.00 ₪', badge: 'הכי נמכר', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'מיסטרי חולצת כדורגל רשמית', price: '149.90 ₪', badge: 'מהדורת VIP', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'מיסטרי קלפים ומדבקות נדירים', price: '49.90 ₪', badge: 'הפתעה מובטחת', img: 'images/pack-ucl-2010.jpg' },
                { title: 'מיסטרי בובות כוכבי העל', price: '29.90 ₪', badge: 'מומלץ', img: 'images/funko-pop-xavi-coach.jpg.png' },
                { title: 'מיסטרי חולצת רטרו היסטורית', price: '179.00 ₪', badge: 'נדיר', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'מיסטרי ליגת האלופות פרימיום', price: '89.90 ₪', badge: 'חדש באתר', img: 'images/pack-ucl-2010.jpg' },
                { title: 'מיסטרי קופסת אספנים מוגבלת', price: '249.00 ₪', badge: 'מוגבל', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'מיסטרי זוג בובות כדורגלנים', price: '39.90 ₪', badge: 'מבצע', img: 'images/funko-pop-xavi-coach.jpg.png' },
                { title: 'מיסטרי מארז שלל מונדיאל', price: '119.00 ₪', badge: 'להיט', img: 'images/pack-ucl-2010.jpg' }
            ],
            packages: [
                { title: 'מארז ליגת האלופות המלא', price: '119.00 ₪', badge: 'מהדורת אלופות', img: 'images/pack-ucl-2010.jpg' },
                { title: 'מארז אימון פרו לשחקנים', price: '189.00 ₪', badge: 'לשחקנים', img: 'images/agiliti-ladder.jpg.png' },
                { title: 'מארז מתנה יוקרתי לאספנים', price: '249.00 ₪', badge: 'מתנה מושלמת', img: 'images/hover-ball.jpg.png' },
                { title: 'מארז פתיחת עונה מושלם', price: '159.00 ₪', badge: 'משתלם', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'מארז אספנות רטרו מוזהב', price: '299.00 ₪', badge: 'VIP', img: 'images/pack-ucl-2010.jpg' },
                { title: 'מארז זוגי לחובבי כדורגל', price: '219.00 ₪', badge: 'זוגי', img: 'images/hover-ball.jpg.png' }
            ],
            accessories: [
                { title: 'סולם זריזות וקואורדינציה מקצועי', price: '79.90 ₪', badge: 'אימון פרו', img: 'images/agiliti-ladder.jpg.png' },
                { title: 'כדור מרחף (Hover Ball) מואר', price: '69.90 ₪', badge: 'להיט לילדים', img: 'images/hover-ball.jpg.png' },
                { title: 'בובת פופ צ׳אבי מאמן', price: '59.90 ₪', badge: 'אספנות', img: 'images/funko-pop-xavi-coach.jpg.png' },
                { title: 'אלבום שומר קלפים קשיח VIP', price: '49.90 ₪', badge: 'הגנה מלאה', img: 'images/pack-ucl-2010.jpg' },
                { title: 'מגן קלף מגנטי (One-Touch)', price: '19.90 ₪', badge: 'שקיפות מלאה', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'חבילת סליבים יוקרתית לקלפים', price: '24.90 ₪', badge: 'חובה לאספנים', img: 'images/pack-ucl-2010.jpg' }
            ],
            cards: [
                { title: 'מעטפת ליגת האלופות 2010', price: '39.90 ₪', badge: 'נדיר', img: 'images/pack-ucl-2010.jpg' },
                { title: 'מארז 5 מעטפות טופס רשמי', price: '64.90 ₪', badge: 'הכי מבוקש', img: 'images/pack-ucl-2010.jpg' },
                { title: 'קופסת בוסטר ליגת האלופות', price: '149.00 ₪', badge: 'סיכוי לחתימה', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'מעטפת מדבקות מונדיאל רשמית', price: '14.90 ₪', badge: 'פאניני מקורי', img: 'images/pack-ucl-2010.jpg' },
                { title: 'מארז קלפי מהדורה מוגבלת Gold', price: '89.90 ₪', badge: 'מוזהב', img: 'images/soccerwe-mistery-pack.jpg.png' },
                { title: 'סט 10 מעטפות אספנים מעורב', price: '119.00 ₪', badge: 'מבצע', img: 'images/pack-ucl-2010.jpg' }
            ]
        };

        let currentCategory = 'mystery';
        let currentPage = 0;
        const ITEMS_PER_PAGE = 6;

        function renderCatalogGrid() {
            const grid = document.getElementById('catalog-products-grid');
            const allItems = catalogData[currentCategory] || catalogData.mystery;
            const start = currentPage * ITEMS_PER_PAGE;
            const pageItems = allItems.slice(start, start + ITEMS_PER_PAGE);
            
            grid.innerHTML = pageItems.map(item => `
                <div class="catalog-product-card">
                    <span class="catalog-card-badge"><i class="fa-solid fa-crown"></i> ${item.badge}</span>
                    <div class="catalog-card-img">
                        <img src="${item.img}" alt="${item.title}" onerror="this.src='images/soccerwe-mistery-pack.jpg.png'">
                    </div>
                    <div class="catalog-card-footer">
                        <h3 class="catalog-product-title">${item.title}</h3>
                        <div class="catalog-card-actions">
                            <button class="catalog-add-btn" onclick="alert('המוצר נוסף לעגלה: ${item.title}')">
                                הוסף לעגלה <i class="fa-solid fa-cart-plus"></i>
                            </button>
                            <div class="catalog-price-box">${item.price}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectCatalogCategory(categoryKey, categoryTitle, clickedBtn) {
            document.querySelectorAll('.sidebar-cat-btn').forEach(btn => btn.classList.remove('active'));
            if (clickedBtn) clickedBtn.classList.add('active');

            currentCategory = categoryKey;
            currentPage = 0;
            document.getElementById('active-category-heading').textContent = categoryTitle;
            renderCatalogGrid();
        }

        function changeCatalogPage(direction) {
            const allItems = catalogData[currentCategory] || [];
            const maxPage = Math.ceil(allItems.length / ITEMS_PER_PAGE) - 1;
            currentPage += direction;
            if (currentPage < 0) currentPage = maxPage;
            if (currentPage > maxPage) currentPage = 0;
            renderCatalogGrid();
        }

        renderCatalogGrid();

        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('header-placeholder');
                if (placeholder) placeholder.innerHTML = data;
            });

        fetch('ticker.html')
            .then(response => response.text())
            .then(data => {
                const placeholder = document.getElementById('ticker-placeholder');
                if (placeholder) placeholder.innerHTML = data;
            });
    </script>
</body>
</html>
