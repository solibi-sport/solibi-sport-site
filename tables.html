<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוליבי ספורט - מרכז הליגות והתוצאות</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- שואב את קובץ העיצוב הגלובלי -->
    <link rel="stylesheet" href="solibi-app.css">
    
    <style>
        /* === צבעים מקומיים ונגיעות כסוף === */
        :root {
            --brand-silver: #D1D5DB;
            --brand-silver-dark: #9CA3AF;
            --border-silver: rgba(209, 213, 219, 0.2);
            --brand-gold: #D6B953; 
            --brand-gold-dark: #B59A3D;
        }

        body {
            background: radial-gradient(circle at 50% 0%, rgba(214, 185, 83, 0.12) 0%, rgba(224, 224, 224, 0.05) 30%, #0a0a0a 70%) !important;
            color: #f5f5f5 !important;
            width: 100vw !important;
            height: 100vh !important; 
            overflow: hidden !important; 
            display: flex !important;
            flex-direction: column !important;
            margin: 0 !important;
        }

        /* =========================================
           מבנה הגריד הראשי
           ========================================= */
        .app-layout-custom {
            flex: 1;
            display: flex;
            gap: 20px; 
            padding: clamp(15px, 2vh, 30px) 20px;
            overflow: hidden;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* הגוש המאוחד: סיידבר ימני + תוכן */
        .main-workspace {
            display: flex;
            flex: 1;
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid var(--border-silver);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            background: linear-gradient(145deg, #1f1f1f 0%, #111 100%);
        }

        /* =========================================
           סיידבר ימני (מחובר לתוכן)
           ========================================= */
        .right-nav {
            flex: 0 0 280px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid rgba(0,0,0,0.2); 
        }

        .sidebar-logo-area {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .sidebar-logo-area h2 {
            font-size: 20px; 
            margin-bottom: 5px;
        }

        .search-box-wrapper {
            padding: 15px;
            border-bottom: 1px dashed rgba(0,0,0,0.2);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background: rgba(0,0,0,0.4); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 35px 10px 15px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #D6B953;
            box-shadow: 0 0 10px rgba(214, 185, 83, 0.2);
            outline: none;
            background: rgba(0,0,0,0.6);
        }

        .search-box input::placeholder { color: rgba(255, 255, 255, 0.5); }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #D6B953;
            font-size: 14px;
        }

        .leagues-nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
            direction: ltr; 
            scrollbar-width: thin;
            scrollbar-color: rgba(214, 185, 83, 0.4) transparent;
        }

        .leagues-nav-list::-webkit-scrollbar { width: 4px; }
        .leagues-nav-list::-webkit-scrollbar-thumb { background: rgba(214, 185, 83, 0.4); border-radius: 10px; }

        .leagues-list-inner { direction: rtl; display: flex; flex-direction: column; gap: 6px; }

        .league-nav-item {
            position: relative; /* הוסף עבור הקו המפריד */
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: transparent;
            border: 1px solid transparent; 
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-align: right;
            width: 100%;
            font-family: inherit;
            color: #f5f5f5; 
        }

        /* קו הפרדה עדין בין הליגות */
        .league-nav-item:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 5%;
            width: 90%;
            height: 1px;
            background: rgba(0, 0, 0, 0.1); 
        }

        .league-nav-item:hover {
            background: rgba(255,255,255,0.05); 
            transform: translateX(-3px);
        }

        .league-nav-item.active {
            background: rgba(214, 185, 83, 0.1); 
            border-color: #D6B953;
        }

        .league-nav-img {
            width: 28px; height: 28px;
            border-radius: 6px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            padding: 2px;
        }
        .league-nav-img img { width: 100%; height: 100%; object-fit: contain; }
        
        .league-nav-text { display: flex; flex-direction: column; }
        .league-nav-title { font-size: 14px; font-weight: 700; transition: 0.2s; }
        .league-nav-sub { font-size: 10px; opacity: 0.7; }
        
        .league-nav-item.active .league-nav-title { color: #D6B953; }
        .league-nav-item.active .league-nav-sub { opacity: 1; color: #a0a0a0; }

        /* =========================================
           מרכז התוכן (כהה)
           ========================================= */
        .center-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 0 פיקסלים מלמעלה! שואב הכל לקצה העליון */
            padding: 0px 35px 15px; 
        }

        .center-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px; /* מרווח עדין מאוד מהמסגרת העליונה */
            margin-bottom: 10px; /* צמצום משמעותי של הרווח מתחת לטאבים */
        }

        .premium-tabs-nav {
            display: flex;
            gap: 15px;
        }
        
        .tab-pill {
            background: transparent;
            border: 1px solid var(--border-silver);
            color: #a0a0a0;
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
        }
        
        .tab-pill:hover { border-color: #D6B953; color: #fff; }
        .tab-pill.active {
            background: #D6B953;
            color: #000;
            border-color: #D6B953;
            box-shadow: 0 4px 12px rgba(214, 185, 83, 0.3);
        }

        .league-data-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
            direction: ltr;
        }
        .league-data-scroll::-webkit-scrollbar { width: 6px; }
        .league-data-scroll::-webkit-scrollbar-thumb { background: rgba(214,185,83,0.4); border-radius: 10px; }
        .league-data-inner { direction: rtl; }

        .api-table { width: 100%; border-collapse: collapse; color: #f5f5f5; font-size: 14px; }
        .api-table th { background: rgba(214, 185, 83, 0.1); color: var(--brand-silver); padding: 12px; text-align: center; border-bottom: 2px solid #D6B953; font-weight: 900; }
        .api-table td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .api-table tr:hover td { background: rgba(255,255,255,0.03); }
        
        .team-cell, .player-cell { display: flex; align-items: center; gap: 12px; justify-content: flex-start; text-align: right; font-weight: 700; }
        .team-logo, .player-img { width: 26px; height: 26px; object-fit: contain; }
        .player-img { border-radius: 50%; background: #222; }

        .match-row {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-silver);
            border-radius: 12px; padding: 14px 20px; margin-bottom: 10px; transition: 0.3s;
            cursor: pointer;
        }
        .match-row:hover { border-color: #D6B953; background: #0a0a0a; transform: translateY(-2px); }
        .match-team { flex: 1; display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .match-team.home { justify-content: flex-end; text-align: left; }
        .match-team.away { justify-content: flex-start; text-align: right; }
        
        .match-score {
            flex: 0 0 110px; text-align: center; font-size: 16px; font-weight: 900;
            color: #D6B953; background: #000; padding: 6px 12px;
            border-radius: 20px; border: 1px solid rgba(214, 185, 83, 0.3);
        }
        .match-date { display: block; font-size: 11px; color: #a0a0a0; margin-top: 3px; font-weight: 400; }

        .round-switcher-bar {
            display: flex; align-items: center; justify-content: center; gap: 20px;
            margin-bottom: 20px; background: rgba(0, 0, 0, 0.4); padding: 10px;
            border-radius: 12px; border: 1px solid var(--border-silver);
        }
        .round-nav-btn {
            background: none; border: 1px solid #D6B953; color: #D6B953;
            padding: 6px 16px; border-radius: 20px; font-family: inherit; font-weight: 700;
            cursor: pointer; transition: 0.2s; font-size: 13px;
        }
        .round-nav-btn:hover:not(:disabled) { background: #D6B953; color: #000; }
        .round-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #444; color: #444; }
        .current-round-text { font-size: 15px; font-weight: 900; color: #f5f5f5; }

        .stats-sub-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .stats-sub-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(214,185,83,0.15);
            color: #a0a0a0; padding: 6px 16px; border-radius: 15px;
            font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .stats-sub-btn:hover { border-color: #D6B953; color: #f5f5f5; }
        .stats-sub-btn.active { background: rgba(214,185,83,0.15); color: #D6B953; border-color: #D6B953; font-weight: 700; }

        .loader { color: #D6B953; font-size: 16px; font-weight: bold; padding: 50px; text-align: center; }

        /* =========================================
           סיידבר שמאלי מופרד (תוצאות לייב)
           ========================================= */
        .left-extra {
            flex: 0 0 280px;
            background: linear-gradient(135deg, #141414 0%, #0a0a0a 100%);
            border: 1px solid var(--border-silver);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .sidebar-title {
            padding: 20px;
            font-size: 18px;
            font-weight: 900;
            color: #f5f5f5;
            text-align: center;
            border-bottom: 1px dashed #333;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 2;
        }

        .live-pulse {
            width: 10px; height: 10px;
            background: #ff3b30;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .live-scroll-wrapper {
            flex: 1;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            display: flex;
            position: relative;
        }

        .live-scroll-content {
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: absolute;
            animation: scrollUpLive 55s linear infinite; 
        }

        .live-scroll-wrapper:hover .live-scroll-content {
            animation-play-state: paused;
        }

        @keyframes scrollUpLive {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* עיצוב הקובייה החדשה והסימטרית */
        .live-match-card {
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid rgba(214, 185, 83, 0.4); 
            border-right: 3px solid #D6B953; 
            border-radius: 10px;
            padding: 10px 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: 0.3s;
        }
        
        .live-match-card:hover {
            border-color: #D6B953;
            transform: translateY(-2px);
            background: linear-gradient(145deg, #222 0%, #111 100%);
            box-shadow: 0 6px 20px rgba(214, 185, 83, 0.2);
        }

        .live-card-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
            padding-bottom: 6px;
        }

        .live-time-badge {
            font-size: 10px;
            color: #D6B953;
            font-weight: 900;
            background: rgba(214, 185, 83, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(214, 185, 83, 0.3);
            animation: pulse 1.5s infinite;
            display: inline-block;
            line-height: 1;
        }

        .live-league-name {
            font-size: 10px;
            color: var(--brand-silver-dark);
            text-align: center;
            font-weight: 500;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        .live-match-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-teams-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            text-align: right;
        }

        .live-team-row {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 20px;
        }

        /* --- תיקון גודל הסמלים בלייב כדי שלא יתפוצצו --- */
        .live-team-row img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .live-team-name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .live-scores-col {
            display: flex;
            flex-direction: column;
            gap: 6px; 
            align-items: center;
            justify-content: center;
            padding-right: 15px;
            border-right: 1px solid rgba(255,255,255,0.05); 
            min-width: 35px;
        }

        .live-score-num {
            font-size: 14px; 
            font-weight: 900;
            color: var(--brand-silver); 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 20px; 
            line-height: 1;
        }

        /* רספונסיביות */
        @media (max-width: 1200px) {
            .left-extra { display: none; }
        }

        @media (max-width: 900px) {
            .app-layout-custom { flex-direction: column; overflow-y: auto; height: auto !important;}
            .main-workspace { flex-direction: column; height: auto; border-radius: 15px;}
            .right-nav { flex: none; width: 100%; height: 250px; border-left: none; border-bottom: 1px solid rgba(0,0,0,0.2); }
            .center-header { flex-direction: column; gap: 15px; }
            .center-content-area { padding: 15px;}
        }
    </style>
</head>

    <main class="app-layout-custom">
        
        <!-- בלוק מחובר: סיידבר ליגות + מרכז תוכן -->
        <div class="main-workspace">
            
            <aside class="app-sidebar right-nav">
                <div class="sidebar-logo-area">
                    <h2 class="silver-glow-text">ליגות</h2>

                <div class="search-box-wrapper">
                    <div class="search-box">

                </div>
                <nav class="leagues-nav-list">

    </main>

        document.addEventListener('DOMContentLoaded', () => {
            renderLeaguesSidebar(leaguesData);
            
            document.getElementById('leagueSearchInput').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = leaguesData.filter(l => l.name.includes(term) || l.sub.includes(term));
                renderLeaguesSidebar(filtered);
            });

            loadLiveScores();
            selectLeague(39, "פרמייר ליג");
        });

        function renderLeaguesSidebar(list) {
            const container = document.getElementById('leagues-nav-list');
            container.innerHTML = '';
            list.forEach(lg => {
                let imgSrc = `https://flagcdn.com/w80/${lg.img}`;
                if(lg.img === 'eu.png') imgSrc = 'https://flagcdn.com/w80/eu.png'; 

                const isActive = lg.id == currentLeagueId ? 'active' : '';
                container.innerHTML += `
                    <button class="league-nav-item ${isActive}" onclick="selectLeague(${lg.id}, '${lg.name}')">
                        <div class="league-nav-img"><img src="${imgSrc}" alt="${lg.name}"></div>
                        <div class="league-nav-text">
                            <span class="league-nav-title">${lg.name}</span>
                            <span class="league-nav-sub">${lg.sub}</span>
                        </div>
                    </button>
                `;
            });
        }

        function selectLeague(id, name) {
            currentLeagueId = id;
            currentLeagueName = name;
            
            renderLeaguesSidebar(leaguesData);
            loadTabData();
        }

        window.switchDataTab = function(index) {
            currentTabIndex = index;
            const btns = document.querySelectorAll('.tab-pill');
            btns.forEach(b => b.classList.remove('active'));
            btns[index].classList.add('active');
            loadTabData();
        }

        function loadTabData() {
            if(!currentLeagueId) return;
            if(currentTabIndex === 0) loadStandings();
            else if(currentTabIndex === 1) initRoundManager();
            else if(currentTabIndex === 2) loadPlayerStats(currentStatsType);
        }

        async function loadStandings() {
            const container = document.getElementById('league-main-display');
            container.innerHTML = '<div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> טוען טבלה...</div>';
            try {
                const res = await fetch(`${BASE_URL}/standings?league=${currentLeagueId}&season=${currentSeason}`, { headers: { 'x-apisports-key': API_KEY } });
                const data = await res.json();
                if(!data.response || data.response.length === 0) { container.innerHTML = '<div class="loader">אין נתוני טבלה זמינים לליגה זו.</div>'; return; }

                const standings = data.response[0].league.standings[0];
                let html = `<table class="api-table"><thead><tr><th>#</th><th style="text-align:right;">קבוצה</th><th>מש'</th><th>נצ'</th><th>תיקו</th><th>הפס'</th><th>שערים</th><th>נק'</th></tr></thead><tbody>`;
                standings.forEach(team => {
                    let teamName = t(team.team.name);
                    html += `<tr><td>${team.rank}</td><td><div class="team-cell"><img src="${team.team.logo}" class="team-logo"><span>${teamName}</span></div></td>
                            <td>${team.all.played}</td><td>${team.all.win}</td><td>${team.all.draw}</td><td>${team.all.lose}</td><td dir="ltr">${team.all.goals.for}:${team.all.goals.against}</td><td style="color:#D6B953; font-weight:900;">${team.points}</td></tr>`;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (err) { container.innerHTML = '<div class="loader">שגיאה בטעינת הנתונים.</div>'; }
        }

        async function initRoundManager() {
            const container = document.getElementById('league-main-display');
            container.innerHTML = '<div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> מכין לוח משחקים...</div>';
            try {
                const roundsRes = await fetch(`${BASE_URL}/fixtures/rounds?league=${currentLeagueId}&season=${currentSeason}`, { headers: { 'x-apisports-key': API_KEY } });
                const roundsData = await roundsRes.json();
                allRounds = roundsData.response || [];

                const currentRes = await fetch(`${BASE_URL}/fixtures/rounds?league=${currentLeagueId}&season=${currentSeason}&current=true`, { headers: { 'x-apisports-key': API_KEY } });
                const currentData = await currentRes.json();
                
                if(currentData.response && currentData.response.length > 0) {
                    selectedRoundName = currentData.response[0];
                    currentRoundIndex = allRounds.indexOf(selectedRoundName);
                } else if(allRounds.length > 0) {
                    currentRoundIndex = 0; selectedRoundName = allRounds[0];
                }
                renderRoundAndFixtures();
            } catch (err) { container.innerHTML = '<div class="loader">שגיאה בארגון לוח משחקים.</div>'; }
        }

        window.changeRound = function(direction) {
            currentRoundIndex += direction;
            selectedRoundName = allRounds[currentRoundIndex];
            renderRoundAndFixtures();
        }

        async function renderRoundAndFixtures() {
            const container = document.getElementById('league-main-display');
            let cleanRoundName = selectedRoundName ? selectedRoundName.replace('Regular Season -', 'מחזור') : 'שלב קבוצות/נוקאאוט';
            
            container.innerHTML = `
                <div class="round-switcher-bar">
                    <button class="round-nav-btn" onclick="changeRound(1)" ${currentRoundIndex >= allRounds.length - 1 ? 'disabled' : ''}>מחזור הבא <i class="fa-solid fa-chevron-left"></i></button>
                    <span class="current-round-text">${t(cleanRoundName)}</span>
                    <button class="round-nav-btn" onclick="changeRound(-1)" ${currentRoundIndex <= 0 ? 'disabled' : ''}><i class="fa-solid fa-chevron-right"></i> מחזור קודם</button>
                </div>
                <div id="fixtures-list-container"><div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> טוען משחקים...</div></div>
            `;
            loadFixturesByRound(selectedRoundName);
        }

        async function loadFixturesByRound(roundName) {
            const listContainer = document.getElementById('fixtures-list-container');
            try {
                let url = `${BASE_URL}/fixtures?league=${currentLeagueId}&season=${currentSeason}`;
                if(roundName) url += `&round=${encodeURIComponent(roundName)}`;
                const res = await fetch(url, { headers: { 'x-apisports-key': API_KEY } });
                const data = await res.json();

                if(!data.response || data.response.length === 0) { listContainer.innerHTML = '<div class="loader">אין משחקים במחזור זה.</div>'; return; }

                let html = '';
                data.response.forEach(match => {
                    const dateObj = new Date(match.fixture.date);
                    const dateStr = dateObj.toLocaleDateString('he-IL');
                    const timeStr = dateObj.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
                    const status = match.fixture.status.short;
                    let scoreDisplay = timeStr;
                    
                    if(['1H','2H','HT','FT','AET','PEN'].includes(status)) {
                        scoreDisplay = `${match.goals.home} - ${match.goals.away}`;
                        if(['1H','2H','HT'].includes(status)) scoreDisplay += `<br><span style="color:#ff4a4a; font-size:10px; font-weight:bold;">חי: דקה ${match.fixture.status.elapsed}'</span>`;
                    }

                    let homeName = t(match.teams.home.name);
                    let awayName = t(match.teams.away.name);

                    html += `<div class="match-row" onclick="if(typeof openMatchEvents === 'function') openMatchEvents(${match.fixture.id}, '${match.teams.home.name.replace(/'/g, "\\'")}', '${match.teams.away.name.replace(/'/g, "\\'")}')">
                            <div class="match-team home"><span>${homeName}</span><img src="${match.teams.home.logo}" class="team-logo"></div>
                            <div class="match-score"><div>${scoreDisplay}</div><span class="match-date">${dateStr}</span></div>
                            <div class="match-team away"><img src="${match.teams.away.logo}" class="team-logo"><span>${awayName}</span></div></div>`;
                });
                listContainer.innerHTML = html;
            } catch (err) { listContainer.innerHTML = '<div class="loader">שגיאה בקריאת המשחקים.</div>'; }
        }

        window.loadPlayerStats = async function(type) {
            currentStatsType = type;
            const container = document.getElementById('league-main-display');
            container.innerHTML = `
                <div class="stats-sub-tabs">
                    <button class="stats-sub-btn ${type === 'topscorers' ? 'active' : ''}" onclick="loadPlayerStats('topscorers')"><i class="fa-solid fa-soccer-ball"></i> שערים</button>
                    <button class="stats-sub-btn ${type === 'topassists' ? 'active' : ''}" onclick="loadPlayerStats('topassists')"><i class="fa-solid fa-handshake"></i> בישולים</button>
                    <button class="stats-sub-btn ${type === 'topyellowcards' ? 'active' : ''}" onclick="loadPlayerStats('topyellowcards')"><i class="fa-solid fa-square" style="color:#ffd700;"></i> צהובים</button>
                    <button class="stats-sub-btn ${type === 'topredcards' ? 'active' : ''}" onclick="loadPlayerStats('topredcards')"><i class="fa-solid fa-square" style="color:#ff4a4a;"></i> אדומים</button>
                </div>
                <div id="stats-data-container"><div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> טוען נתונים...</div></div>
            `;

            const dataContainer = document.getElementById('stats-data-container');
            try {
                const res = await fetch(`${BASE_URL}/players/${type}?league=${currentLeagueId}&season=${currentSeason}`, { headers: { 'x-apisports-key': API_KEY } });
                const data = await res.json();
                if(!data.response || data.response.length === 0) { dataContainer.innerHTML = '<div class="loader">אין נתונים כרגע.</div>'; return; }

                let statHeader = type === 'topassists' ? "בישולים" : type === 'topyellowcards' ? "צהובים" : type === 'topredcards' ? "אדומים" : "שערים";
                let tableHtml = `<table class="api-table"><thead><tr><th>#</th><th style="text-align:right;">שחקן</th><th style="text-align:right;">קבוצה</th><th>${statHeader}</th></tr></thead><tbody>`;

                data.response.slice(0, 15).forEach((item, index) => {
                    const player = item.player; const stats = item.statistics[0];
                    let statValue = type === 'topassists' ? stats.goals.assists : type === 'topyellowcards' ? stats.cards.yellow : type === 'topredcards' ? stats.cards.red : stats.goals.total;
                    
                    let playerName = t(player.name);
                    let teamName = t(stats.team.name);

                    tableHtml += `<tr><td><b>${index + 1}</b></td><td><div class="player-cell"><img src="${player.photo}" class="player-img"><span>${playerName}</span></div></td>
                            <td><div class="team-cell"><img src="${stats.team.logo}" class="team-logo"><span style="font-weight:400; color:#a0a0a0;">${teamName}</span></div></td>
                            <td style="color:#D6B953; font-weight:900; font-size:16px;">${statValue || 0}</td></tr>`;
                });
                tableHtml += `</tbody></table>`;
                dataContainer.innerHTML = tableHtml;
            } catch (err) { dataContainer.innerHTML = '<div class="loader">שגיאה במשיכת הנתונים.</div>'; }
        }

        async function loadLiveScores() {
            const container = document.getElementById('live-scores-container');
            try {
                const res = await fetch(`${BASE_URL}/fixtures?live=all`, { headers: { 'x-apisports-key': API_KEY } });
                const data = await res.json();

                if(!data.response || data.response.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: var(--brand-silver); font-size: 13px; margin-top: 20px;">אין משחקים חיים כרגע.</div>';
                    return;
                }

                let html = '';
                data.response.slice(0, 15).forEach(match => {
                    let homeName = t(match.teams.home.name);
                    let awayName = t(match.teams.away.name);
                    let leagueName = t(match.league.name);
                    let escHome = match.teams.home.name.replace(/'/g, "\\'");
                    let escAway = match.teams.away.name.replace(/'/g, "\\'");
                    
                    html += `
                        <div class="live-match-card" onclick="if(typeof openMatchEvents === 'function') openMatchEvents(${match.fixture.id}, '${escHome}', '${escAway}')">
                            <div class="live-card-header">
                                <span class="live-time-badge">${match.fixture.status.elapsed}'</span>
                                <span class="live-league-name">${leagueName}</span>
                            </div>
                            <div class="live-match-content">
                                <div class="live-teams-col">
                                    <div class="live-team-row">
                                        <img src="${match.teams.home.logo}" alt="logo">
                                        <span class="live-team-name">${homeName}</span>
                                    </div>
                                    <div class="live-team-row">
                                        <img src="${match.teams.away.logo}" alt="logo">
                                        <span class="live-team-name">${awayName}</span>
                                    </div>
                                </div>
                                <div class="live-scores-col">
                                    <span class="live-score-num">${match.goals.home}</span>
                                    <span class="live-score-num">${match.goals.away}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html + html; 
            } catch(e) {
                container.innerHTML = '<div style="text-align: center; color: #ff3b30; font-size: 12px; margin-top: 20px;">שגיאה בטעינת הלייב</div>';
            }
        }
    </script>
