<style>
    .top-header {
        background: linear-gradient(180deg, #12141c 0%, #0b0c10 100%);
        border-bottom: 2px solid #D4AF37;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.85), 0 2px 12px rgba(212, 175, 55, 0.15);
        padding: 14px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        direction: rtl;
        font-family: 'Rubik', sans-serif;
    }

    /* צד ימין: לוגו */
    .header-logo {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffffff;
        text-decoration: none;
        display: flex;
        align-items: center;
        transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .header-logo:hover {
        transform: scale(1.04);
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    .header-logo .dot {
        color: #D4AF37;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.9);
    }

    /* מרכז: מסגרת קפסולה מוזהבת לכותרות */
    .main-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(18, 20, 28, 0.9);
        padding: 7px 14px;
        border-radius: 50px;
        border: 1px solid rgba(212, 175, 55, 0.55);
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 18px rgba(212, 175, 55, 0.12);
    }

    /* כפתורי הכותרות במרכז */
    .gold-nav-item {
        position: relative;
        color: #e2e8f0;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        padding: 9px 20px;
        border-radius: 40px;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .gold-nav-item i {
        color: #D4AF37;
        font-size: 15px;
        transition: transform 0.3s ease, color 0.3s ease;
    }

    /* הדגשה מיוחדת לכפתור הגרלת ה-VIP בקפסולה */
    .gold-nav-item.raffle-nav-highlight {
        background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.22) 0%, rgba(212, 175, 55, 0.06) 100%);
        border-color: rgba(212, 175, 55, 0.45);
        color: #fff3b0;
        font-weight: 800;
    }

    /* אפקט הברקת זהב חולפת במעבר עכבר */
    .gold-nav-item::before {
        content: '';
        position: absolute;
        top: 0;
        right: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.28), transparent);
        transition: right 0.55s ease;
    }

    /* קו תחתון מוזהב שנפתח מהמרכז במעבר עכבר */
    .gold-nav-item::after {
        content: '';
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 2px;
        background: #D4AF37;
        box-shadow: 0 0 8px #D4AF37;
        transition: width 0.3s ease;
        border-radius: 2px;
    }

    .gold-nav-item:hover {
        color: #D4AF37;
        background: rgba(212, 175, 55, 0.14);
        border-color: rgba(212, 175, 55, 0.55);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
    }

    .gold-nav-item:hover::before {
        right: 100%;
    }

    .gold-nav-item:hover::after {
        width: 55%;
    }

    .gold-nav-item:hover i {
        transform: scale(1.2) rotate(-8deg);
        color: #fff;
    }

    /* בועת כמות פריטים בעגלה */
    .cart-badge {
        background: #D4AF37;
        color: #0b0c10;
        font-size: 11px;
        font-weight: 900;
        padding: 1px 6px;
        border-radius: 20px;
        margin-right: 2px;
    }

    /* צד שמאל: שורת חיפוש מוזהבת */
    .header-search-wrapper {
        position: relative;
        width: 260px;
    }

    .header-search-input {
        width: 100%;
        background: rgba(18, 20, 28, 0.9);
        border: 1px solid rgba(212, 175, 55, 0.5);
        color: #ffffff;
        padding: 10px 18px 10px 40px;
        border-radius: 50px;
        font-family: 'Rubik', sans-serif;
        font-size: 13px;
        outline: none;
        box-sizing: border-box;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .header-search-input::placeholder {
        color: #94a3b8;
    }

    .header-search-input:focus {
        border-color: #D4AF37;
        box-shadow: 0 0 16px rgba(212, 175, 55, 0.35), inset 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .header-search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #D4AF37;
        font-size: 14px;
        pointer-events: none;
    }
</style>

<header class="top-header">
    <!-- ימין: לוגו האתר -->
    <a href="index.html" class="header-logo">SOLIBI<span class="dot">.</span></a>
    
    <!-- מרכז: הכותרות בתוך מסגרת זהב אינטראקטיבית -->
    <nav class="main-nav">
        <a href="login.html" class="gold-nav-item">
            <i class="fa-regular fa-user"></i> כניסה / התחברות
        </a>
        <a href="index.html" class="gold-nav-item">
            <i class="fa-solid fa-house"></i> ראשי
        </a>
        <a href="catalog.html" class="gold-nav-item">
            <i class="fa-solid fa-layer-group"></i> קטלוג
        </a>
        <a href="raffle.html" class="gold-nav-item raffle-nav-highlight">
            <i class="fa-solid fa-trophy"></i> הגרלת VIP
        </a>
        <a href="cart.html" class="gold-nav-item">
            <i class="fa-solid fa-cart-shopping"></i> עגלה
            <span class="cart-badge" style="display: none;">0</span>
        </a>
    </nav>

    <!-- שמאל: שורת חיפוש -->
    <div class="header-search-wrapper">
        <input type="text" id="headerSearchInput" class="header-search-input" placeholder="חיפוש מוצר בחנות...">
        <i class="fa-solid fa-magnifying-glass header-search-icon"></i>
    </div>
</header>
