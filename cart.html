<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוליבי ספורט - עגלת קניות</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- שואב את העיצוב הגלובלי (לפוטר ולהדר) -->
    <link rel="stylesheet" href="solibi-app.css">
    
    <style>
        /* === צבעים מקומיים - הוספת נגיעות הכסוף === */
        :root {
            --brand-silver: #D1D5DB;
            --brand-silver-dark: #9CA3AF;
            --border-silver: rgba(209, 213, 219, 0.2);
        }

        /* =========================================
           דריסות מבנה - תואם ב-100% לשאר הדפים
           ========================================= */
        body {
            background: radial-gradient(circle at 50% 0%, rgba(214, 185, 83, 0.12) 0%, rgba(224, 224, 224, 0.05) 30%, #0a0a0a 70%) !important;
            color: #f5f5f5 !important;
            width: 100vw !important;
            height: 100vh !important; 
            overflow: hidden !important; 
            display: flex !important;
            flex-direction: column !important;
            margin: 0 !important;
        }

        /* אזור התוכן המרכזי */
        .cart-main-container {
            flex: 1 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: clamp(15px, 3vh, 40px) 15px !important;
            overflow: hidden !important; 
        }
        
        /* חלון העגלה (קוביית הזכוכית) */
        .cart-glass-box {
            display: flex;
            flex-direction: row; 
            width: 100% !important; 
            max-width: 1100px !important; 
            height: 100% !important; 
            max-height: 700px !important; 
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.85) 0%, rgba(5, 5, 5, 0.95) 100%) !important;
            backdrop-filter: blur(15px) !important;
            border: 1px solid var(--border-silver) !important; /* מסגרת כסופה */
            border-radius: 20px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8) !important;
            overflow: hidden !important; 
            animation: fadeUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           רשימת המוצרים (צד ימין)
           ========================================= */
        .cart-items-side { 
            flex: 1.8; 
            padding: 30px; 
            overflow-y: auto; 
            direction: ltr; /* מעביר את פס הגלילה לשמאל כדי שלא יפריע למסגרת */
            
            scrollbar-width: thin;
            scrollbar-color: rgba(214, 185, 83, 0.4) transparent;
        }
        
        .cart-items-side::-webkit-scrollbar { width: 6px; }
        .cart-items-side::-webkit-scrollbar-thumb { background: rgba(214, 185, 83, 0.4); border-radius: 10px; }

        .cart-items-inner { direction: rtl; } /* מחזיר ל-RTL את התוכן עצמו */

        .cart-item {
            display: flex; 
            align-items: center; 
            background: rgba(0, 0, 0, 0.5); 
            padding: 15px; 
            border-radius: 15px;
            margin-bottom: 15px; 
            border: 1px solid var(--border-silver); /* מסגרת כסופה למוצר */
            transition: 0.3s;
        }

        .cart-item:hover { 
            transform: translateX(-5px); 
            border-color: #D6B953; /* הופך לזהב במעבר עכבר */
            box-shadow: 0 5px 15px rgba(214, 185, 83, 0.15); 
            background: #141414;
        }
        
        .item-img { 
            width: 70px; height: 70px; 
            background: #000; 
            border: 1px solid var(--border-silver); /* מסגרת כסופה לתמונה */
            border-radius: 10px; 
            margin-left: 20px; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; flex-shrink: 0; 
        }

        .item-img img { width: 100%; height: 100%; object-fit: cover; }
        .item-img svg { width: 40px; height: 40px; color: #D6B953; opacity: 0.5; }
        
        .item-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .item-title { font-weight: 900; color: #f5f5f5; font-size: 16px; margin-bottom: 5px; }
        .item-price { color: #D6B953; font-weight: 700; }
        
        /* כפתורי כמות */
        .quantity-controls { 
            display: flex; align-items: center; gap: 12px; margin: 0 20px; 
            background: #000; padding: 5px; border-radius: 30px; 
            border: 1px solid var(--border-silver); /* נגיעה כסופה */
        }

        .q-btn { 
            width: 28px; height: 28px; border-radius: 50%; border: none; 
            background: #141414; cursor: pointer; font-weight: bold; font-size: 16px; 
            transition: 0.2s; display: flex; align-items: center; justify-content: center; 
            color: #f5f5f5; border: 1px solid rgba(255,255,255,0.1);
        }

        .q-btn:hover { background: #D6B953; color: #000; border-color: #D6B953; }
        .q-num { font-weight: 700; width: 20px; text-align: center; color: #f5f5f5; }
        
        /* כפתור מחיקה */
        .remove-item { 
            color: #ff6b6b; cursor: pointer; font-size: 18px; margin-right: 15px; 
            transition: 0.3s; font-weight: bold; background: none; border: none; padding: 10px; 
        }
        .remove-item:hover { color: #ff3b30; transform: scale(1.2); }

        /* =========================================
           סיכום הזמנה (צד שמאל)
           ========================================= */
        .cart-summary-side { 
            flex: 1; 
            background: linear-gradient(135deg, #0f0f0f 0%, #000 100%);
            border-right: 1px solid var(--border-silver); /* קו הפרדה כסוף */
            padding: 35px; color: #fff; display: flex; flex-direction: column; 
        }

        .summary-title { 
            font-size: 22px; font-weight: 900; margin-bottom: 30px; 
            border-bottom: 1px solid var(--border-silver); /* קו תחתון כסוף */
            padding-bottom: 15px; color: #D6B953; 
        }

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 15px; color: #a0a0a0; font-weight: 500; }
        .free-shipping { color: #D6B953; font-weight: 900; }
        
        .total-row { 
            margin-top: auto; border-top: 1px dashed var(--border-silver); /* קו הפרדה כסוף */
            padding-top: 25px; font-size: 22px; font-weight: 900; 
            display: flex; justify-content: space-between; align-items: center; 
            color: #f5f5f5;
        }
        
        .checkout-btn {
            background: #D6B953; color: #000; border: none; padding: 18px; border-radius: 12px;
            font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 25px; transition: 0.3s; width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .checkout-btn:hover { background: #FDF3C6; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(214, 185, 83, 0.3); }
        .checkout-btn:disabled { opacity: 0.5; pointer-events: none; background: #333; color: #666; }

        /* מצב עגלה ריקה */
        .empty-cart-msg { text-align: center; padding: 50px; display: none; }
        .empty-cart-msg a { 
            display: inline-block; margin-top: 15px; background: #D6B953; 
            color: #000; padding: 10px 20px; border-radius: 10px; 
            text-decoration: none; font-weight: bold; transition: 0.3s; 
        }
        .empty-cart-msg a:hover { background: #FDF3C6; transform: translateY(-2px); }

        /* ==============================================
           רספונסיביות
           ============================================== */
        @media (max-width: 1024px) {
            .cart-glass-box { max-width: 95% !important; }
            .cart-items-side { padding: 20px; }
            .cart-summary-side { padding: 25px; }
            .item-img { width: 60px; height: 60px; margin-left: 15px; }
        }

        @media (max-width: 800px) {
            .cart-glass-box { flex-direction: column; overflow-y: auto; height: auto !important; max-height: 90vh !important; }
            .cart-summary-side { flex: none; border-right: none; border-top: 1px solid var(--border-silver); }
            .cart-item { flex-wrap: wrap; }
            .quantity-controls { margin: 10px 0 0 0; width: fit-content; }
            .remove-item { margin-left: auto; margin-right: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. הדר אחיד -->
    <div id="header-placeholder"></div>

    <!-- 2. אזור הבמה המרכזי -->
    <main class="cart-main-container">
        
        <!-- קוביית הזכוכית (העגלה עצמה) -->
        <div class="cart-glass-box">
            
            <!-- אזור רשימת המוצרים (צד ימין) -->
            <div class="cart-items-side">
                <div class="cart-items-inner" id="cart-items-list">
                    <!-- המוצרים יוזרקו לפה ע"י ה-JS -->
                </div>
                
                <div id="empty-msg" class="empty-cart-msg">
                    <h2 style="color: #a0a0a0;">העגלה שלך ריקה...</h2>
                    <a href="index.html">חזור לחנות לרכישות</a>
                </div>
            </div>

            <!-- אזור סיכום ההזמנה (צד שמאל) -->
            <div class="cart-summary-side">
                <h2 class="summary-title">סיכום הזמנה</h2>
                <div class="summary-row"><span>פריטים:</span> <span id="items-count">0</span></div>
                <div class="summary-row"><span>משלוח:</span> <span class="free-shipping">חינם!</span></div>
                
                <div class="total-row">
                    <span>סה"כ:</span> 
                    <span id="total-price">0 ₪</span>
                </div>
                
                <button class="checkout-btn" id="checkout-btn" onclick="goToCheckout()">המשך לתשלום</button>
            </div>

        </div>
    </main>

    <!-- 3. פוטר וטיקר (משתמש במחלקות המקוריות מדף הבית כדי להיראות זהה לחלוטין) -->
    <footer class="app-footer">
        <div class="footer-links">
            <a href="about.html">אודות</a>
            <a href="contact.html">צור קשר</a>
            <a href="terms.html">תקנון ומדיניות</a>
        </div>
        <div id="ticker-placeholder"></div>
    </footer>

    <!-- סקריפטים (אותה לוגיקה מעולה שעבדה קודם) -->
    <script>
        fetch('header.html').then(res => res.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
        fetch('ticker.html').then(res => res.text()).then(data => document.getElementById('ticker-placeholder').innerHTML = data);

        // הפונקציה המקורית מהקובץ הקודם[cite: 9]
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            const list = document.getElementById('cart-items-list');
            const emptyMsg = document.getElementById('empty-msg');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            let totalItems = 0;
            let totalPrice = 0;

            list.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.style.display = 'block';
                checkoutBtn.disabled = true;
            } else {
                emptyMsg.style.display = 'none';
                checkoutBtn.disabled = false;

                cart.forEach((item, index) => {
                    totalItems += item.quantity;
                    totalPrice += (item.price * item.quantity);

                    // תמיכה בתמונה רגילה או באייקון SVG[cite: 9]
                    let imageHTML = item.img && item.img.includes('<svg') ? item.img : `<img src="${item.img || 'mystery-box.jpg.png'}" alt="${item.name}">`;

                    list.innerHTML += `
                        <div class="cart-item">
                            <div class="item-img">${imageHTML}</div>
                            <div class="item-info">
                                <div class="item-title">${item.name}</div>
                                <div class="item-price">${item.price} ₪</div>
                            </div>
                            <div class="quantity-controls">
                                <button class="q-btn" onclick="updateItemQuantity(${index}, 1)">+</button>
                                <span class="q-num">${item.quantity}</span>
                                <button class="q-btn" onclick="updateItemQuantity(${index}, -1)">-</button>
                            </div>
                            <button class="remove-item" onclick="removeFromCart(${index})" title="הסר פריט">✕</button>
                        </div>
                    `;
                });
            }
            
            updateSummary(totalItems, totalPrice);
        }

        function updateSummary(count, price) {
            document.getElementById('items-count').innerText = count;
            document.getElementById('total-price').innerText = price + ' ₪';
            
            // עדכון כמות העגלה למעלה בהדר[cite: 9]
            try { 
                if(typeof updateCartDisplay === 'function') updateCartDisplay(); 
            } catch(e) {}
        }

        // שינוי כמות מתוך העגלה בזמן אמת[cite: 9]
        function updateItemQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            if (cart[index]) {
                cart[index].quantity += change;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
                localStorage.setItem('solibiCart', JSON.stringify(cart));
                renderCart();
            }
        }

        // מחיקת מוצר לגמרי[cite: 9]
        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('solibiCart', JSON.stringify(cart));
            renderCart();
        }

        function goToCheckout() {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            if (cart.length > 0) {
                window.location.href = 'checkout.html';
            } else {
                alert("העגלה שלך ריקה. אנא הוסף מוצרים לפני המעבר לתשלום.");
            }
        }

        window.onload = renderCart;
    </script>

    <script src="search.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
