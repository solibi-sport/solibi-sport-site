<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוליבי ספורט - עגלת קניות</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="solibi-app.css">
    
    <style>
        body.cart-page-body {
            background-color: #0b0c10 !important;
            background-image: radial-gradient(circle at 50% 10%, rgba(200, 210, 230, 0.12) 0%, transparent 60%), url("data:image/svg+xml,%3Csvg width='52' height='26' viewBox='0 0 52 26' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M10 16.95l-5-2.88V8.3l5-2.88 5 2.88v5.77l-5 2.88zm32 0l-5-2.88V8.3l5-2.88 5 2.88v5.77l-5 2.88zM26 26l-5-2.88v-5.77l5-2.88 5 2.88v5.77L26 26zM26 7.7l-5-2.88V-.94l5-2.88 5 2.88v5.77L26 7.7z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") !important;
            color: #ffffff !important;
            width: 100vw !important;
            height: auto !important; 
            min-height: 100vh !important;
            overflow-x: hidden !important;
            overflow-y: auto !important; 
            display: flex !important;
            flex-direction: column !important;
            margin: 0 !important;
        }

        .cart-main-container {
            flex: 1 !important; display: flex !important; justify-content: center !important;
            align-items: flex-start !important; padding: 50px 20px !important; overflow: visible !important; 
        }
        
        .cart-glass-box {
            display: flex; flex-direction: row; width: 100% !important; max-width: 1100px !important; 
            height: auto !important; min-height: 550px !important; 
            background: linear-gradient(145deg, #1c1f26 0%, #111318 100%) !important;
            border: 1px solid rgba(212, 175, 55, 0.35) !important; border-radius: 20px !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6) !important; overflow: visible !important; 
            animation: fadeUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }

        .cart-items-side { flex: 1.8; padding: 40px; overflow: visible !important; direction: rtl; }

        .cart-item {
            display: flex; align-items: center; background: #070709; padding: 15px; 
            border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(212, 175, 55, 0.2); transition: 0.3s;
        }

        .cart-item:hover { transform: translateX(-5px); border-color: #D4AF37; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.15); background: #0a0a0a; }
        
        .item-img { 
            width: 70px; height: 70px; background: #000; border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px; margin-left: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; 
        }

        .item-img img { width: 100%; height: 100%; object-fit: cover; }
        .item-img svg { width: 40px; height: 40px; color: #D4AF37; opacity: 0.5; }
        
        .item-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .item-title { font-weight: 900; color: #f5f5f5; font-size: 16px; margin-bottom: 5px; }
        .item-price { color: #D4AF37; font-weight: 700; }
        
        .quantity-controls { 
            display: flex; align-items: center; gap: 12px; margin: 0 20px; 
            background: #000; padding: 5px; border-radius: 30px; border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .q-btn { 
            width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(255,255,255,0.05); cursor: pointer; font-weight: bold; font-size: 16px; 
            transition: 0.2s; display: flex; align-items: center; justify-content: center; color: #f5f5f5; border: 1px solid rgba(255,255,255,0.1);
        }

        .q-btn:hover { background: #D4AF37; color: #000; border-color: #D4AF37; }
        .q-num { font-weight: 700; width: 20px; text-align: center; color: #f5f5f5; }
        
        .remove-item { color: #ff6b6b; cursor: pointer; font-size: 18px; margin-right: 15px; transition: 0.3s; font-weight: bold; background: none; border: none; padding: 10px; }
        .remove-item:hover { color: #ff3b30; transform: scale(1.2); }

        .cart-summary-side { 
            flex: 1; background: transparent; border-right: 1px solid rgba(212, 175, 55, 0.35); 
            padding: 40px; color: #fff; display: flex; flex-direction: column; 
        }

        .summary-title { font-size: 22px; font-weight: 900; margin-bottom: 30px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 15px; color: #D4AF37; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 15px; color: #a0a0a0; font-weight: 500; }
        .free-shipping { color: #D4AF37; font-weight: 900; }
        
        .total-row { 
            margin-top: auto; border-top: 1px dashed rgba(212, 175, 55, 0.3); padding-top: 25px; font-size: 22px; font-weight: 900; 
            display: flex; justify-content: space-between; align-items: center; color: #f5f5f5;
        }
        
        .checkout-btn {
            background: #D4AF37; color: #000; border: none; padding: 18px; border-radius: 12px;
            font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 25px; transition: 0.3s; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .checkout-btn:hover { background: #FDF3C6; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(212, 175, 55, 0.3); }
        .checkout-btn:disabled { opacity: 0.5; pointer-events: none; background: #333; color: #666; }

        .empty-cart-msg { text-align: center; padding: 50px; display: none; margin-top: 50px;}
        .empty-cart-actions { display: flex; gap: 15px; justify-content: center; margin-top: 25px; }
        .empty-cart-actions a { 
            display: inline-block; background: #D4AF37; color: #000; padding: 12px 30px; border-radius: 10px; 
            text-decoration: none; font-weight: bold; transition: 0.3s; font-family: inherit; font-size: 15px;
        }
        .empty-cart-actions a:hover { background: #FDF3C6; transform: translateY(-2px); }

        @media (max-width: 1024px) {
            .cart-glass-box { max-width: 95% !important; }
            .cart-items-side { padding: 20px; }
            .cart-summary-side { padding: 25px; }
            .item-img { width: 60px; height: 60px; margin-left: 15px; }
        }

        @media (max-width: 800px) {
            .cart-glass-box { flex-direction: column; overflow-y: auto; height: auto !important; }
            .cart-summary-side { flex: none; border-right: none; border-top: 1px solid rgba(212, 175, 55, 0.35); }
            .cart-item { flex-wrap: wrap; }
            .quantity-controls { margin: 10px 0 0 0; width: fit-content; }
            .remove-item { margin-left: auto; margin-right: 0; }
        }
    </style>
</head>
<body class="cart-page-body">

    <div id="header-placeholder"></div>

    <main class="cart-main-container">
        <div class="cart-glass-box">
            <div class="cart-items-side">
                <div class="cart-items-inner" id="cart-items-list"></div>
                <div id="empty-msg" class="empty-cart-msg">
                    <h2 style="color: #a0a0a0;">העגלה שלך ריקה...</h2>
                    <div class="empty-cart-actions">
                        <a href="index.html">חזור לחנות לרכישות <i class="fa-solid fa-store"></i></a>
                    </div>
                </div>
            </div>

            <div class="cart-summary-side">
                <h2 class="summary-title">סיכום הזמנה</h2>
                <div class="summary-row"><span>פריטים:</span> <span id="items-count">0</span></div>
                <div class="summary-row"><span>משלוח:</span> <span class="free-shipping">חינם!</span></div>
                <div class="total-row"><span>סה"כ:</span> <span id="total-price">0 ₪</span></div>
                <button class="checkout-btn" id="checkout-btn" onclick="goToCheckout()">המשך לתשלום</button>
            </div>
        </div>
    </main>

    <div id="ticker-placeholder"></div>

    <script>
        fetch('header.html').then(res => res.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            if(typeof updateCartBadge === 'function') updateCartBadge();
        });
        fetch('ticker.html').then(res => res.text()).then(data => document.getElementById('ticker-placeholder').innerHTML = data);

        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            const list = document.getElementById('cart-items-list');
            const emptyMsg = document.getElementById('empty-msg');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            let totalItems = 0;
            let totalPrice = 0;

            list.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.style.display = 'block';
                checkoutBtn.disabled = true;
            } else {
                emptyMsg.style.display = 'none';
                checkoutBtn.disabled = false;

                cart.forEach((item, index) => {
                    totalItems += item.qty;
                    totalPrice += (item.price * item.qty);
                    let imageHTML = item.img && item.img.includes('<svg') ? item.img : `<img src="${item.img}" alt="${item.name}">`;

                    list.innerHTML += `
                        <div class="cart-item">
                            <div class="item-img">${imageHTML}</div>
                            <div class="item-info">
                                <div class="item-title">${item.name}</div>
                                <div class="item-price">${item.price.toFixed(2)} ₪</div>
                            </div>
                            <div class="quantity-controls">
                                <button class="q-btn" onclick="updateItemQuantity(${index}, 1)">+</button>
                                <span class="q-num">${item.qty}</span>
                                <button class="q-btn" onclick="updateItemQuantity(${index}, -1)">-</button>
                            </div>
                            <button class="remove-item" onclick="removeFromCart(${index})" title="הסר פריט">✕</button>
                        </div>
                    `;
                });
            }
            updateSummary(totalItems, totalPrice);
            updateCartBadge();
        }

        function updateSummary(count, price) {
            document.getElementById('items-count').innerText = count;
            document.getElementById('total-price').innerText = price.toFixed(2) + ' ₪';
        }

        function updateItemQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            if (cart[index]) {
                cart[index].qty += change;
                if (cart[index].qty <= 0) cart.splice(index, 1);
                localStorage.setItem('solibiCart', JSON.stringify(cart));
                renderCart();
            }
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('solibiCart', JSON.stringify(cart));
            renderCart();
        }

        function goToCheckout() {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            if (cart.length > 0) window.location.href = 'checkout.html';
        }
        
        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('solibiCart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const headerLinks = document.querySelectorAll('.main-nav a, .header-center a, .header-actions button');
            headerLinks.forEach(link => {
                if (link.innerText.includes('עגלה') || link.classList.contains('cart-btn')) {
                    link.style.position = 'relative';
                    let badge = link.querySelector('.cart-badge');
                    if (totalQty > 0) {
                        if (!badge) {
                            badge = document.createElement('span');
                            badge.className = 'cart-badge';
                            link.appendChild(badge);
                        }
                        badge.innerText = totalQty;
                        badge.style.display = 'flex';
                    } else if (badge) { badge.style.display = 'none'; }
                }
            });
        }
        window.onload = renderCart;
    </script>
    <script src="search.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
